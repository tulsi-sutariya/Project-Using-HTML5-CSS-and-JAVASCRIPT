<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22-Email Working Subscription</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            height: 100vh;
            overflow: hidden;
            width: 100vw;
            background: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8)),url(Images/meeting.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .container{
            color: white;
            margin: 120px 6%;
            
        }
        h3{
            font-size: 23px;
        }
        h1{
            margin-top: 35px;
            font-size: 45px;
        }
        p{
            margin-top: 17px;
        }
        form{
            display:flex;
            margin-top: 37px;
        }
        form input{
            height: 50px;
            width: 400px;
            padding: 10px 20px;
            border: 0;
            outline: none;
            font-size: 23px;
        }
        form img{
            padding: 10px 13px 10px;
            width: 60px;
            text-align: center;
        }
        form button{
            border: none;
            outline: none;
            height: 50px;
            background-color: green;
        }
        #msg{
            color: green;
            font-size: 16px;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
            <h3>Cooming Soon!</h3>
            <h1>Our Brand New <br>Website Is On It`s Way</h1>
            <p>Subscribe for more details</p>
            <form action="" name="submit-to-google-sheet">
                <input type="email" name="Email" placeholder="Your Email-id" required>
                <button type="submit"><img src="Images/send-50.png" alt=""></button>
            </form>
            <span id="msg"></span>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzJ_GMsn-IFxmwuS3VgZb0j9p1O-7Xinuzv44zJwwBqZitIbLTCThXEiJ3uV3Wo4icxsg/exec'
        const form = document.forms['submit-to-google-sheet']
        const msg=document.getElementById("msg")
       
      
        form.addEventListener('submit', e => {
          e.preventDefault()
          fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                msg.innerHTML="Thank You For Subscribing!"
                setTimeout(function(){
                    msg.innerHTML=""
                },5000)
                form.reset()
            })
            .catch(error => console.error('Error!', error.message))
        })
      </script>
</body>
</html>
