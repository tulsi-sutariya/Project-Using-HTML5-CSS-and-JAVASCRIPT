<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9-Create a Drag-Drop</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .container{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        .right,.left{
            height: 280px;
            width: 280px;
            border:2px dashed white;
            cursor: grab;
        }
        .left{
            margin-right: 40px;
        }
        .list{
            margin: 23px;
            background-color: red;
            color: white;
            height: 40px;
            display: flex;
            align-items: center;
        }
        img{
            color: white;
            padding-left: 23px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right:10px ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="list" draggable="true"><img src="Images/bxs-grid.svg" alt="">List Item 1</div>
            <div class="list" draggable="true"><img src="Images/bxs-grid.svg" alt="">List Item 2</div>
            <div class="list" draggable="true"><img src="Images/bxs-grid.svg" alt="">List Item 3</div>
            <div class="list" draggable="true"><img src="Images/bxs-grid.svg" alt="">List Item 4</div>
        </div>
        <div class="right">

        </div>
    </div>

    <script>
        const lists=document.querySelectorAll(".list")
        const left=document.querySelector(".left")
        const right=document.querySelector(".right")

        for(let list of lists){
            list.addEventListener("dragstart",(e)=>{
                let selected=e.target
          
            right.addEventListener("dragover",(e)=>{
                e.preventDefault()
            })
            right.addEventListener("drop",()=>{
                right.appendChild(selected)
                selected=null
            })
            left.addEventListener("dragover",(e)=>{
                e.preventDefault()
            })
            left.addEventListener("drop",()=>{
                left.appendChild(selected)
                selected=null
            })
        })
        }
      











    </script>
</body>
</html>
