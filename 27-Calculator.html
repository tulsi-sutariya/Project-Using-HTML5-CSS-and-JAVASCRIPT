<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-Calculator</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                box-sizing: border-box;
            }
            body{
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .container{
                width: 300px;
                background:#304452;
                padding: 10px;
                border-radius: 10px;
            }
            .container .calculator div input{
                background: transparent;
                width: 60px;
                height: 60px;
                border-radius: 10px;
                cursor: pointer;
                box-shadow: -8px -8px 15px rgba(255,255,255,0.1),
                            5px 5px 15px rgba(0,0,0,0.2);   
                border: none;
                outline: none;
                font-size: 20px;
                margin: 3px;
                color: white;
            }
            .container .calculator form .display{
                display: flex;
                flex-direction: flex-end;
                margin: 7px 0;
                margin-bottom: 14px;
            }
            form .display #display{
                text-align: right;
                flex: 1;
                font-size: 45px;
                box-shadow: none;
            }
            .container .calculator form .equal{
                width: 130px;
            }
            .container .calculator .operator{
                color: aqua;
            }
        </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" id="display" name="display">
                </div>
                <div>
                    <input type="button" value="AC" class="operator" onclick="display.value = '' ">
                    <input type="button" value="DE" class="operator" onclick="display.value = display.value.toString().slice(0,-1)">
                    <input type="button" value="." class="operator" onclick="display.value += '.' ">
                    <input type="button" value="/" class="operator" onclick="display.value += '/' ">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value += '7' ">
                    <input type="button" value="8" onclick="display.value += '8' ">
                    <input type="button" value="9" onclick="display.value += '9' ">
                    <input type="button" value="*" class="operator" onclick="display.value += '*' ">
                </div>
                <div>
                    <input type="button" value="4" onclick="display.value += '4' ">
                    <input type="button" value="5" onclick="display.value += '5' ">
                    <input type="button" value="6" onclick="display.value += '6' ">
                    <input type="button" value="-" class="operator" onclick="display.value += '-' ">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1' ">
                    <input type="button" value="2" onclick="display.value += '2' ">
                    <input type="button" value="3" onclick="display.value += '3' ">
                    <input type="button" value="+" class="operator" onclick="display.value += '+' ">
                </div>
                <div>
                    <input type="button" value="00" onclick="display.value += '00' ">
                    <input type="button" value="0" onclick="display.value += '0' ">
                    <input type="button" value="=" class="operator equal" onclick="display.value = eval(display.value)">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
