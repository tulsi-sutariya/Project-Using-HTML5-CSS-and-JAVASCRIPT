<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16-Password Generator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .main{
            height: 100vh;
            width: 100vw;
            background-color:black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            min-width: 400px;
            background-color:orchid;
            padding: 10px;
            border-radius: 10px;
        }
        input:focus-visible{
            outline: none;
        }
        .rows{
            display: flex;
           margin-top: 10px;
            justify-content: space-between;
        }
        span{
            padding:5px;
            background-color: white;
            border-radius: 5px;
            display: block;
            font-size: 33px;
            width: 100%;
           
        }
        .left{
            color: white;
        }
        .row button{
            margin-top: 15px;
            width: 100%;
            text-align: center;
            background-color:darkorchid;
            border: none;
            outline: none;
            border-radius: 5px;
            font-weight: 500;
            padding-block: 5px;
            color: white;
            font-size: 18px;
            transition:all 0.3s ease;
        }
        .row button:hover{
            background-color:fuchsia;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }
       
    </style>
</head>
<body>
    <div class="main">
        <div class="box">
           <span class="passbox">Testing</span>
            <div class="rows">
                <div class="left">
                    <password for="password">Password Length</label>
                </div>
                <div class="right"><input type="number"  id="total_char" max="30" min="2" value="0"></div>
            </div>
            <div class="rows">
                <label for="upper-case">
                    <div class="left">Contains Uppercase</div>
                </label>
                <div class="right"><input type="checkbox" id="upper-case"></div>
            </div>
            <div class="rows">
                <label for="lower-case">
                    <div class="left">Contains Lowercase</div>
                </label>
                <div class="right"><input type="checkbox" id="lower-case">
                </input></div>
            </div>
            <div class="rows">
                <label for="Digit">
                    <div class="left">
                        Contains Numbers</div>
                </label>
                <div class="right"><input type="checkbox" id="number"></div>
            </div>
            <div class="rows">
                <label for="Sybmols">
                    <div class="left">Contains Sybmols</div>
                </label>
                <div class="right"><input type="checkbox" id="sybmol"></div>
            </div>
            <div class="row">
                <button type="submit" id="btn">Generate</button>
            </div>
        </div>
    </div>

    <script>
        const upperSet="ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        const lowerSet="abcdefghijklmnopqrstuvwxyz"
        const numberSet="0123456789"
        const sybmolSet="~!@#$%^&*()_+/\?"

        const total_char=document.querySelector("#total_char")
        const upperinput=document.querySelector("#upper-case")
        const lowerinput=document.querySelector("#lower-case")
        const numberinput=document.querySelector("#number")
        const sybmolinput=document.querySelector("#sybmol")
        const button=document.querySelector("#btn")
        const passbox=document.querySelector(".passbox")

        const passwordGenerator=(dataSet)=>{
            return dataSet[Math.floor(Math.random() * dataSet.length)]
        }
        const generatePass=(password="")=>{
            if(upperinput.checked){
                password += passwordGenerator(upperSet)
            }
            if(lowerinput.checked){
                password += passwordGenerator(lowerSet)
            }
            if(numberinput.checked){
                password += passwordGenerator(numberSet)
            }
            if(sybmolinput.checked){
                password += passwordGenerator(sybmolSet)
            }
            if(password.length < total_char.value){
                return generatePass(password)
            }

            passbox.innerText = truncateString(password,total_char.value)
        }

        button.addEventListener("click",()=>{
            generatePass()
        })

        function truncateString(str,num){
            if(str.length>num){
                let substr= str.substring(0,num)
                return substr
            }
            else{
                return str
            }
        }
    </script>
</body>
</html>
