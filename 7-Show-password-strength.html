<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Show password strength</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color:black;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .input-container{
           position: absolute;
           top: 50%;
           left: 50%;
           width: 30%;
           transform: translate(-50%,-50%);
        }
        img{
            width: 140%;
            height: 80%;
        }
        .btn{
            border: none;
            outline: none;
            cursor: pointer;
            position: absolute;
            top: 12%;
            left:91%;
            transform: translate(-50%);
            border-radius: 50%;
        }
        .btn img{
            width: 35px;
            height: 35px;
            object-fit: cover;
        }
        input[type="password"]{
            background-color:black;
            outline: none;
            color: white;
            border:1px solid aquamarine;
            width: 100%;
            padding: 15px;
            padding-right: 180px;
        }
        ::placeholder{
            font-size: 18px;
           
        }
        .message{
            padding-top: 10px;
            color: aquamarine;
            display: none;
       
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-container">
            <input type="password" name="" id="password" placeholder="Password">
            <div class="btn"><img src="Images/icons8-back-arrow-64.png" alt=""></div>
            <p class="message">Password is <spna class="strength"></spna> </p>
        </div>
    </div>
    <script>
        const msg=document.querySelector(".message")
        const password=document.querySelector("#password")
        const str=document.querySelector(".strength")
        password.addEventListener("input",()=>{
            if(password.value.length > 0){
                msg.style.display="block"
            }
            else{
                msg.style.display="none"
            }
            if(password.value.length < 4){
                str.innerHTML="weak" 
                msg.style.color="red"
                password.style.border="1px solid red"
            }
            if(password.value.length >= 4 &&  password.value.length < 8){
                str.innerHTML="medium"
                msg.style.color="yellow"
                password.style.border="1px solid yellow"
            }
            if(password.value.length >= 8){
                str.innerHTML="strong"
                msg.style.color="lawngreen"
                password.style.border="1px solid lawngreen"
            }
        })
    </script>
</body>
</html>
