<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-Login and Registration Page</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: url(Images/beach.jpg);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        header{
            width: 100%;
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h2{
            font-size: 39px;
            color: white;
        }
        header nav{
            display: flex;
            gap: 20px;
            margin-right: 40px;
            margin-top: 20px;
            
        }
        header nav a{
            text-decoration: none;
            color: white;
            margin-right: 10px;
            font-size: 20px;
            padding-top: 7px;
            position: relative;
        }
        header nav a:after{
            content: "";
            position: absolute;
            background-color: white;
            height: 3px;
            width: 100%;
            left: 0;
            bottom: -2px;
            transform-origin: right;
            transform: scaleX(0);
            transition: transform 0.3s ease;
            border-radius: 5px;

        }
        header nav a:hover::after{
            transform-origin: left;
            transform: scaleX(1);
        }
        header nav button{
            border: 2px solid white;
            outline: none;
            font-size: 20px;
            background: none;
            color: white;
            padding: 5px 30px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        header nav button:hover{
            background-color: white;
            color: black;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 76vh;
            transform: scale(0);
            transition: transform 0.5s ease;
        }
        .container.active{
            transform: scale(1);
        }
        .container .register.active{
            visibility: hidden;
        }
        .container .form-box{
            width: 400px;
            min-height: 390px;
            padding: 30px;
            padding-bottom: 20px;
           transform: translate(-110%);
            position: relative;
            border-radius: 10px;
            top: 50%;
            left: 50%;
            backdrop-filter: blur(20px);
            border: 1px solid white;
            box-shadow: 0 0 14px rgba(255,255,255,0.91);
        }
        .container .register{
            visibility: hidden;
            transform: translate(-210%);
            position: relative;
            top: 50%;
            left: 50%;
            
        }
        .container .form-box h2{
            font-size: 31px;
            margin-bottom: 30px;
            text-align: center;
        }
        .container .form-box .input-box{
            display: flex;
            position: relative;
            height: 50px;
            border-bottom: 2px solid black;
            width: 100%;
            margin: 27px 0;
        }
        .container .form-box .input-box input{
           color: white;
            border: none;
            font-size: 18px;
            padding-right: 34px;
            height: 100%;
            padding-left:5px ;
            letter-spacing: 1.69px;
            width: 100%;
            padding-top: 10px;
            outline: none;
            background: transparent;
        }
        .container .input-box span{
            padding-top: 14px;
        }
        .container .input-box span img{
            position: absolute;
            width: 9%;
            right: 0px;
        }
        .container .input-box label{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left:5px;
            font-weight: 500;
            font-size: 19px;
            transition: top 0.4s ease;
        }
    
        .container .input-box input:focus~label,
        .container .input-box input:valid~label{
            top: -1px;
        }
        .container .mix-box{
            display: flex;
            justify-content: space-between;
        }
        .mix-box span:hover{
            text-decoration: underline;
        }
        .container .btn button{
            width: 100%;
            margin-block: 20px;
            background-color:black;
            color: white;
            font-size: 21px;
            cursor: pointer;
            border: none;
            outline: none;
            border-radius: 10px;
            padding: 10px;
            transform: all 0.5s ease;
        }
        .btn button:hover{
            background-color: white;
            color: black;
        }
        .container .registerP{
            text-align: center;
        }
        .container .registerP a{
            text-decoration: none;
            color: black;
            font-weight: bolder;
        }
        .registerP a:hover{
            text-decoration: underline;
        }
        
        .container .form-box .cross{
            background-color: black;
            position: absolute;
            top:0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            overflow: hidden;
            border-top-right-radius: 20px;
            border-bottom-left-radius: 20px;
        }
        .register .mix-box .condition:hover{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h2>Logo</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Service</a>
            <a href="#">Contact</a>
            <button class="log-btn">Login</button>
        </nav>
    </header>

    <div class="container">
        <div class="form-box">
            <div class="cross">
            <img src="Images/icons8-cross-30.png" >
        </div>
            <h2>Login</h2>
            <div class="input-box email">
                <span><img src="Images/bx-email.svg"></span>
                <input type="email" id="email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-box password">
                <span><img src="Images/bxs-lock-alt.svg" alt=""></span>
                <input type="password" id="password" required>
                <label for="password">Password</label>
            </div>
            <div class="mix-box">
                <label for=""><input type="checkbox"  id="chk"> <span>Remember Me</span></label>
                <span>Forgot Password?</span>
            </div>
            <div class="btn">
                <button>Login</button>
            </div>
            <div class="registerP">
                Don`t have an account? <a href="#" class="register-link">Register</a></span>
            </div>
        </div>

        <div class="form-box register">
            <div class="cross">
            <img src="Images/icons8-cross-30.png" >
        </div>
            <h2>Registration</h2>
            <div class="input-box user">
                <span><img src="Images/bx-user.svg"></span>
                <input type="text" required>
                <label for="user">Usename</label>
            </div>
            <div class="input-box email">
                <span><img src="Images/bx-email.svg"></span>
                <input type="email" id="email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-box password">
                <span><img src="Images/bxs-lock-alt.svg" alt=""></span>
                <input type="password" id="password" required>
                <label for="password">Password</label>
            </div>
            <div class="mix-box">
                <label for=""><input type="checkbox"  id="chk"> <span class="condition">I agree to the terms & conditions</span></label>
            </div>
            <div class="btn">
                <button>Register</button>
            </div>
            <div class="registerP">
                Already have an account? <a href="#" class="login-link">Login</a></span>
            </div>
        </div>
    </div>


    <script>
        const register_link=document.querySelector(".register-link")
        const login_link = document.querySelector(".login-link")
        const cross=document.querySelector(".cross")
        const log_btn=document.querySelector(".log-btn")
        const register=document.querySelector(".register")
        const container=document.querySelector(".container")
        const form_box=document.querySelector(".form-box")

        log_btn.addEventListener("click",()=>{
            container.classList.add("active")
        })

        register_link.addEventListener("click",()=>{
            register.style.visibility="visible"
           form_box.style.visibility="hidden"

        })
        login_link.addEventListener("click",()=>{
             register.style.visibility="hidden"
           form_box.style.visibility="visible"
        })

        cross.addEventListener("click",()=>{
            container.classList.remove("active")
        })
    </script>
    <script type="module" src="26-Register.js" defer></script>
</body>
</html>
