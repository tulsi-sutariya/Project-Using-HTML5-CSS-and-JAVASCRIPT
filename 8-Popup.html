<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Popup making</title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            background-color:lawngreen;
        }
        .container{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn1{
            padding: 10px 60px;
            font-size: 23px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            
            outline: none;
            border-radius: 25px;
        }
        .popup{
            width: 400px;
            background-color: white;
            text-align: center;
            border-radius: 5px;
            top: -70%;
            top: 10%;
            left: 50%;
            visibility: hidden;
            left: 50%;
            position: absolute;
            transition: all 0.4s;
            transform: translate(-50%) scale(0.1);
            box-shadow: 0 5px 2px rgba(0,0,0,0.2);
        }
        img{
            margin-top: -50px;
            width: 25%;
           filter: brightness(100%);
          border-radius: 50%;
        }
        h2{
            font-size: 38px;
            margin-top: 37px;
            text-align: center;
        }
        p{
            text-align: center;
            margin-top: 20px;
            padding-inline: 35px;
            line-height: 22px;
        }
        .btn2{
            width: 80%;
            background-color:forestgreen;
            border: none;
            outline: none;
            font-size: 18px;
            color: white;
            margin-top: 36px;
            margin-bottom: 23px;
            margin-inline: 25px;
            box-shadow: 0 5px 5px rgba(0,0,0,0.2);
            height: 40px;
            border-radius: 5px;
            padding: 10px auto;
        }
        .popup button{
            padding: 10px auto;
        }
        .open{
            top: 25%;
            transform: translate(-50%) scale(1);
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="container">
        <button type="submit" class="btn1">Submit</button>
        <div class="popup">
            <img src="Images/tick-icon.png" alt="">
            <h2>Thank You!</h2>
            <p>Your details has been successfully submitted. Thanks!</p>
            <button type="ok" class="btn2">OK</button>
        </div>
    </div>
    <script>
        const btn1=document.querySelector(".btn1")
        const btn2=document.querySelector(".btn2")
        const popup=document.querySelector(".popup")
        btn1.addEventListener("click",()=>{
            popup.classList.add("open")
        })
        btn2.addEventListener("click",()=>{
            popup.classList.remove("open")
        })
    </script>
</body>
</html>
