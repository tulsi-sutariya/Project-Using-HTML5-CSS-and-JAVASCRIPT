<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Login form</title>
    <script src="./2-Login-form.js" defer></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        body{
            background-image: url(Images/image-2-desing.webp);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            transition: all 2s;
        }
        .form-container{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }
        .form-container form{
            height: 380px;
            width: 360px;
            border: 2px solid white;
            border-radius:10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.42);
            transform-style: preserve-3d;
        }
        .form-container form h2{
            font-size: 30px;
            letter-spacing: 3px;
            text-align: center;
            padding-top: 15px;
            padding-bottom: 15px;
            color: white;
        }
        img{
            padding: 0 5px;
            
            vertical-align: middle;
        }
        input{
            width: 80%;
            height: 40px;
            margin: 10px 5px;
            border: none;
            margin-top: 18px;
            outline: none;
            font-size: 17px;
            padding: 10px;
            letter-spacing: 1px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.43) inset;
        }
        input[type="text"]:focus,input[type="email"]:focus,input[type="password"]:focus{
            background:linear-gradient(90deg,magenta,cornflowerblue);
            color: white;
        }
        
    
        input[type="submit"]{
            border-radius: 20px;
            font-size: 20px;
            width: 90%;
            background: linear-gradient(90deg,magenta,cornflowerblue);
            margin-top: 30px;
            cursor: pointer;
            margin-left: 15px;
            transform: all 0.4s linear; 
            color: white;
            border: none;
            outline: none;
        }
        input[type="submit"]:hover{
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form class="form1">
            <h2>Login</h2>
            <img src="Images/bx-user.svg" alt="" id="user">
            <input type="text" placeholder="Username" required>
            <img src="Images/bx-email.svg" alt="" id="email"> 
            <input type="email" placeholder="Email"  required>
            <img src="Images/bx-lock-alt.svg" alt="" id="password">
            <input type="password" placeholder="Password"  required>
            <input type="submit" value="Login">
        </form>
    </div>
    
</body>
</html>
