<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Hide Password</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            background-color:blue;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        .password-box{
            width: 26%;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 40%;
        
            background-color: white;
            border-radius: 5px;
        }
        input{
            width: 100%;
            border: none;
            outline: none;
            height: 15%;
            font-size: 20px;
            padding: 5px;
            padding-right: 35px;
        }
        img{
            height: 10%;
            width: 10%;
        }
    </style>
</head>
<body>
    <div class="password-box">
        <input type="password" name="" id="pass" placeholder="password">
        <img src="Images/icons8-closed-eye-64.png" alt="" class="closed">
    </div>
    <script>
        const closeEye=document.querySelector(".closed")
        const pass=document.getElementById("pass")

        closeEye.onclick=function(){
            if(pass.type == "password"){
                 pass.type = "text"
                closeEye.src="Images/eye-svgrepo-com.svg"
                //openEye.style.visibility="visible"
            }
            else{
                pass.type = "password"
                closeEye.src="Images/icons8-closed-eye-64.png"
            }
        }
    </script>
</body>
</html>
