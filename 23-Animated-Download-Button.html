<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-Animated Download <Button></Button></title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        .container{
            height: 200px;
            width: 200px;
            position: relative;
            display:flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: conic-gradient(#333 0%,#333 100%);
            cursor: pointer;
            user-select:none;
            overflow: hidden;
        }
        .container::before{
            content: '';
            position: absolute;
            inset: 15px;
            border-radius: 50%;
            background-color: #222;
            opacity: 0.9;
        }
        .download{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            transform: 0.5s;
        }
        .download.start{
            transform: translateY(160%);
        }
        img{
            width: 35%;
            text-align: center;        }
        .container .number{
            font-size: 44px;
            color: white;
            text-align: center;
            z-index: 100;
        }
        .container .check{
            position: absolute;
            text-align: center;
        }
        .container.done{
            background:rgb(255, 0, 251) !important;
        }
        .container.done .number{
            font-size: 5em;
            line-height: 1em;
        }
        .container.done .number p{
            position: absolute;
            font-size: 0.2em;
            text-transform: uppercase;
            top: 110px;
            left: 30%;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.05em;
            
        }
    </style>
</head>
<body>
    <div class="container">
      <img src="Images/arrow-48.png" alt="" class="download">
      <img src="Images/check-48.2 (2).png" alt="" style="visibility: hidden" class="check">
        <h2 class="number"></h2>
    </div>
    <script>
        const download=document.querySelector(".download")
        const container=document.querySelector(".container")
        const number=document.querySelector(".number")
        const check=document.querySelector(".check")
       
     
        download.addEventListener("click",(e)=>{
           download.classList.add("start")
           let deg=0
           let interval=setInterval(function(){
            deg += 1
            if(deg >100){
                clearInterval(interval)
                check.style.visibility="visible"
                check.style.zIndex="100"
                number.innerHTML="<p>100% Done</p>"
                number.style.paddingTop="10px"
                container.classList.add("done")
                return
            }
            container.style.background=`conic-gradient(cornflowerblue ${deg}%,#333 0%)`
            number.innerHTML= deg + "<span>%</span>"
           },100)
          
        })
    </script>
</body>
</html>
